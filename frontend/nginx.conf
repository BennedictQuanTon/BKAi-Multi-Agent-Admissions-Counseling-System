server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA: "/" is the landing page, "/chat" and the rest are client routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Vite assets are content-hashed: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Film, posters, screenshots, certificates (nginx serves byte ranges for <video> seeking)
    location /media/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location ~* \.vtt$ {
        default_type text/vtt;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml text/vtt;
    gzip_min_length 256;
}
